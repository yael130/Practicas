<div class="counter-container">
  <div class="counter-card">
    <h2 class="title">Counter</h2>
    <div class="counter-display">
      <span class="value" [class.positive]="counter > 0" [class.negative]="counter < 0">{{ counter }}</span>
    </div>
    
    <div class="actions">
      <button class="btn btn-decrement" (click)="decreaseBy(1)" aria-label="Decrease counter">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </button>
      
      <button class="btn btn-reset" (click)="reset()" aria-label="Reset counter">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
        <span>Reset</span>
      </button>

      <button class="btn btn-increment" (click)="increaseBy(1)" aria-label="Increase counter">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </button>
    </div>
  </div>
</div>
